[build]
  base = "."
  publish = "."
  functions = "netlify/functions"
  command = "npm install && node build-data.js"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]
  included_files = ["scripts/**", "docs/**", "assets/manifest.json"]

[[redirects]]
  from = "/api/generate-image/*"
  to = "/.netlify/functions/generate-image/:splat"
  status = 200

[[redirects]]
  from = "/api/generate-image"
  to = "/.netlify/functions/generate-image"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
